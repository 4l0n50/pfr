[package]
name = "pfr"
version = "0.1.0"
edition = "2018"

[dependencies]
ark-bls12-381 = { version = "^0.3.0", default-features = false, features = ["curve"] }
ark-ec = { version = "^0.3.0", default-features = false }
ark-ff = { version = "^0.3.0", default-features = false }
ark-marlin = { git = "https://github.com/4l0n50/marlin", branch = "marlin_fixes", default-features = false }
ark-poly = { version = "^0.3.0", default-features = false }
ark-poly-commit = { version = "^0.3.0", default-features = false }
ark-serialize = { version = "^0.3.0", default-features = false }
ark-std = { version = "^0.3.0", default-features = false }
blake2 = { version = "0.9", default-features = false }
rand_chacha = { version = "0.3.0", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proof_of_function_relation = { path = "../functional-commitment/proof_of_function_relation" }
homomorphic_poly_commit = { path = "../functional-commitment/homomorphic_poly_commit" }
fiat_shamir_rng = { path = "../functional-commitment/fiat_shamir_rng" }
ark-bn254 = "0.3.0"
ark-bls12-381 = { version = "^0.3.0", default-features = false, features = ["curve"] }

[features]
default = ["std", "parallel"]
std = [
  "ark-ff/std",
  "ark-poly/std",
  "ark-std/std",
  "ark-serialize/std",
  "ark-poly-commit/std",
  "ark-marlin/std",
]
parallel = [
  "std",
  "ark-ff/parallel",
  "ark-poly/parallel",
  "ark-std/parallel",
  "ark-poly-commit/parallel",
]

[[example]]
name = "pfr"
path = "examples/pfr.rs"
required-features = ["std"]

[[bench]]
name = "pfr"
path = "benches/pfr.rs"
harness = false
required-features = ["std"]

[[bench]]
name = "comparison"
path = "benches/comparison.rs"
harness = false
required-features = ["std"]

[[bench]]
name = "theoretical"
path = "benches/theoretical.rs"
harness = false
required-features = ["std"]

[profile.release]
opt-level = 3
lto = "thin"
debug = true

[profile.bench]
opt-level = 3
lto = "thin"
debug = true
